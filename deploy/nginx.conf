server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    location = / {
        return 302 /quant-sentinel/;
    }

    location = /quant-sentinel {
        return 301 /quant-sentinel/;
    }

    location /quant-sentinel/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /quant-sentinel/index.html;
    }

    location = /quant-sentinel/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /quant-sentinel/assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /quant-sentinel;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1860s;
        proxy_read_timeout 1860s;
        proxy_buffering off;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
