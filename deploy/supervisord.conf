[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/app/logs/supervisord

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:nginx]
command=/bin/sh -c 'nginx -g "daemon off;" 2>&1 | tee -a /app/logs/supervisord/nginx.log'
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=/bin/sh -c 'uvicorn xquant.api.app:create_app --factory --host 127.0.0.1 --port 8000 2>&1 | tee -a /app/logs/supervisord/backend.log'
directory=/app
environment=PYTHONUNBUFFERED="1",PYTHONDONTWRITEBYTECODE="1"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:logrotate]
command=/bin/sh -c 'while true; do /usr/sbin/logrotate --state /app/logs/supervisord/logrotate.state /etc/logrotate-nginx.conf 2>&1 | tee -a /app/logs/supervisord/logrotate.log; sleep 60; done'
directory=/app
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
